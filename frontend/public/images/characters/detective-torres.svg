<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 200" fill="none">
  <!-- Background -->
  <rect width="150" height="200" fill="#2d3748" rx="10"/>
  <!-- Body/Jacket -->
  <path d="M40 200 L40 140 Q75 120 110 140 L110 200" fill="#553c9a"/>
  <!-- Shirt/collar -->
  <path d="M60 145 L75 160 L90 145" fill="#faf089" stroke="#f6e05e" stroke-width="1"/>
  <!-- Badge -->
  <g transform="translate(50,155)">
    <polygon points="10,0 20,5 20,18 10,22 0,18 0,5" fill="#f6e05e"/>
    <circle cx="10" cy="11" r="5" fill="#c05621"/>
  </g>
  <!-- Head -->
  <ellipse cx="75" cy="85" rx="35" ry="40" fill="#d4a574"/>
  <!-- Hair (long, dark) -->
  <path d="M40 85 Q38 50 75 42 Q112 50 110 85 Q110 70 105 60 Q95 48 75 45 Q55 48 45 60 Q40 70 40 85" fill="#1a202c"/>
  <path d="M40 85 Q42 100 45 115 L50 115 Q48 100 48 85" fill="#1a202c"/>
  <path d="M110 85 Q108 100 105 115 L100 115 Q102 100 102 85" fill="#1a202c"/>
  <!-- Eyes -->
  <g fill="#1a202c">
    <ellipse cx="62" cy="82" rx="5" ry="6"/>
    <ellipse cx="88" cy="82" rx="5" ry="6"/>
  </g>
  <!-- Eyelashes -->
  <g stroke="#1a202c" stroke-width="1">
    <path d="M57 76 L55 73" fill="none"/>
    <path d="M62 75 L62 72" fill="none"/>
    <path d="M67 76 L69 73" fill="none"/>
    <path d="M83 76 L81 73" fill="none"/>
    <path d="M88 75 L88 72" fill="none"/>
    <path d="M93 76 L95 73" fill="none"/>
  </g>
  <!-- Eyebrows -->
  <g stroke="#1a202c" stroke-width="2">
    <path d="M54 72 Q62 70 70 72" fill="none"/>
    <path d="M80 72 Q88 70 96 72" fill="none"/>
  </g>
  <!-- Nose -->
  <path d="M75 85 L75 95 L70 100" fill="none" stroke="#c99a6a" stroke-width="2"/>
  <!-- Mouth (slight smile) -->
  <path d="M65 110 Q75 118 85 110" fill="none" stroke="#b8735a" stroke-width="2"/>
  <!-- Name plate -->
  <rect x="25" y="175" width="100" height="20" fill="#1a202c"/>
  <text x="75" y="189" text-anchor="middle" font-family="Arial" font-size="10" fill="#f7fafc" font-weight="bold">Det. Torres</text>
</svg>