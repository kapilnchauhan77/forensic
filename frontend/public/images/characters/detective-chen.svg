<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 200" fill="none">
  <!-- Background -->
  <rect width="150" height="200" fill="#2d3748" rx="10"/>
  <!-- Body/Jacket -->
  <path d="M40 200 L40 140 Q75 120 110 140 L110 200" fill="#1a202c"/>
  <!-- Shirt/collar -->
  <path d="M60 145 L75 160 L90 145" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Badge -->
  <g transform="translate(50,155)">
    <polygon points="10,0 20,5 20,18 10,22 0,18 0,5" fill="#f6e05e"/>
    <circle cx="10" cy="11" r="5" fill="#c05621"/>
  </g>
  <!-- Head -->
  <ellipse cx="75" cy="85" rx="35" ry="40" fill="#d69e7e"/>
  <!-- Hair -->
  <path d="M45 70 Q45 45 75 45 Q105 45 105 70 Q105 60 95 55 Q85 50 75 50 Q65 50 55 55 Q45 60 45 70" fill="#1a202c"/>
  <!-- Eyes -->
  <g fill="#1a202c">
    <ellipse cx="62" cy="82" rx="5" ry="6"/>
    <ellipse cx="88" cy="82" rx="5" ry="6"/>
  </g>
  <!-- Eyebrows -->
  <g stroke="#1a202c" stroke-width="2">
    <path d="M55 74 Q62 72 68 74" fill="none"/>
    <path d="M82 74 Q88 72 95 74" fill="none"/>
  </g>
  <!-- Nose -->
  <path d="M75 85 L75 95 L70 100" fill="none" stroke="#b7846e" stroke-width="2"/>
  <!-- Mouth -->
  <path d="M65 110 Q75 115 85 110" fill="none" stroke="#a0522d" stroke-width="2"/>
  <!-- Name plate -->
  <rect x="25" y="175" width="100" height="20" fill="#1a202c"/>
  <text x="75" y="189" text-anchor="middle" font-family="Arial" font-size="10" fill="#f7fafc" font-weight="bold">Det. Chen</text>
</svg>