<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c4a6e"/>
      <stop offset="100%" style="stop-color:#075985"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Fingerprint whorl pattern -->
  <g fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.9">
    <!-- Center dot -->
    <circle cx="256" cy="256" r="12" fill="#38bdf8"/>
    <!-- Inner rings -->
    <ellipse cx="256" cy="256" rx="40" ry="35"/>
    <ellipse cx="256" cy="256" rx="70" ry="60"/>
    <ellipse cx="256" cy="256" rx="100" ry="85"/>
    <!-- Outer whorl lines -->
    <path d="M 156 256 Q 156 156 256 156 Q 356 156 356 256"/>
    <path d="M 136 276 Q 136 136 256 136 Q 376 136 376 256"/>
    <path d="M 116 296 Q 116 116 256 116 Q 396 116 396 256"/>
    <!-- Bottom curves -->
    <path d="M 156 256 Q 156 356 256 356 Q 356 356 356 256"/>
    <path d="M 136 236 Q 136 376 256 376 Q 376 376 376 256"/>
    <path d="M 116 216 Q 116 396 256 396 Q 396 396 396 256"/>
  </g>
  <!-- Small accent for "forensic" feel -->
  <circle cx="420" cy="92" r="24" fill="#22d3ee" opacity="0.8"/>
</svg>
