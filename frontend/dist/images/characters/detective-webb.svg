<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 200" fill="none">
  <!-- Background -->
  <rect width="150" height="200" fill="#2d3748" rx="10"/>
  <!-- Body/Jacket -->
  <path d="M40 200 L40 140 Q75 120 110 140 L110 200" fill="#2c5282"/>
  <!-- Shirt/collar -->
  <path d="M60 145 L75 160 L90 145" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Tie -->
  <path d="M75 160 L70 175 L75 200 L80 175 Z" fill="#c53030"/>
  <!-- Badge -->
  <g transform="translate(95,155)">
    <polygon points="10,0 20,5 20,18 10,22 0,18 0,5" fill="#f6e05e"/>
    <circle cx="10" cy="11" r="5" fill="#c05621"/>
  </g>
  <!-- Head -->
  <ellipse cx="75" cy="85" rx="35" ry="40" fill="#8b7355"/>
  <!-- Hair (short, greying) -->
  <path d="M45 75 Q45 48 75 45 Q105 48 105 75 Q105 55 75 52 Q45 55 45 75" fill="#718096"/>
  <!-- Glasses -->
  <g fill="none" stroke="#1a202c" stroke-width="2">
    <rect x="50" y="76" width="20" height="15" rx="2"/>
    <rect x="80" y="76" width="20" height="15" rx="2"/>
    <line x1="70" y1="83" x2="80" y2="83"/>
    <line x1="50" y1="83" x2="45" y2="80"/>
    <line x1="100" y1="83" x2="105" y2="80"/>
  </g>
  <!-- Eyes (behind glasses) -->
  <g fill="#1a202c">
    <ellipse cx="60" cy="84" rx="4" ry="5"/>
    <ellipse cx="90" cy="84" rx="4" ry="5"/>
  </g>
  <!-- Nose -->
  <path d="M75 88 L75 98 L72 102" fill="none" stroke="#7a6548" stroke-width="2"/>
  <!-- Mouth -->
  <path d="M67 112 Q75 114 83 112" fill="none" stroke="#6b5344" stroke-width="2"/>
  <!-- Name plate -->
  <rect x="25" y="175" width="100" height="20" fill="#1a202c"/>
  <text x="75" y="189" text-anchor="middle" font-family="Arial" font-size="10" fill="#f7fafc" font-weight="bold">Det. Webb</text>
</svg>