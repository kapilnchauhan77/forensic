<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 200" fill="none">
  <!-- Background -->
  <rect width="150" height="200" fill="#2d3748" rx="10"/>
  <!-- Body/Suit -->
  <path d="M40 200 L40 140 Q75 120 110 140 L110 200" fill="#1a202c"/>
  <!-- Shirt/collar -->
  <path d="M60 145 L75 160 L90 145" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Tie -->
  <path d="M75 160 L70 175 L75 200 L80 175 Z" fill="#1a202c"/>
  <!-- FBI Badge -->
  <g transform="translate(50,150)">
    <ellipse cx="15" cy="12" rx="15" ry="12" fill="#2b6cb0"/>
    <text x="15" y="15" text-anchor="middle" font-family="Arial" font-size="8" fill="#f7fafc" font-weight="bold">FBI</text>
  </g>
  <!-- Head -->
  <ellipse cx="75" cy="85" rx="35" ry="40" fill="#f0d9c4"/>
  <!-- Hair (professional, side part) -->
  <path d="M43 75 Q43 48 75 45 Q107 48 107 75 Q107 58 100 52 Q85 45 70 48 Q50 52 43 75" fill="#1a202c"/>
  <!-- Eyes -->
  <g fill="#1a202c">
    <ellipse cx="62" cy="82" rx="5" ry="6"/>
    <ellipse cx="88" cy="82" rx="5" ry="6"/>
  </g>
  <!-- Eyebrows (serious expression) -->
  <g stroke="#1a202c" stroke-width="2.5">
    <path d="M54 74 L68 72" fill="none"/>
    <path d="M82 72 L96 74" fill="none"/>
  </g>
  <!-- Nose -->
  <path d="M75 85 L75 95 L70 100" fill="none" stroke="#d4c4b4" stroke-width="2"/>
  <!-- Mouth (neutral/serious) -->
  <path d="M67 112 L83 112" fill="none" stroke="#a08070" stroke-width="2"/>
  <!-- Earpiece -->
  <circle cx="42" cy="90" r="4" fill="#1a202c"/>
  <path d="M42 94 Q40 110 45 120" stroke="#1a202c" stroke-width="2" fill="none"/>
  <!-- Name plate -->
  <rect x="25" y="175" width="100" height="20" fill="#1a202c"/>
  <text x="75" y="189" text-anchor="middle" font-family="Arial" font-size="10" fill="#f7fafc" font-weight="bold">Agent Park</text>
</svg>