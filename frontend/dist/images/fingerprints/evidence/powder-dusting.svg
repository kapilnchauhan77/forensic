<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none">
  <rect width="300" height="200" fill="#2d3748"/>
  <!-- Dusted surface -->
  <rect x="20" y="20" width="260" height="160" fill="#1a202c" stroke="#4a5568" stroke-width="2"/>
  <!-- Powder particles scattered -->
  <g fill="#e2e8f0" opacity="0.6">
    <circle cx="45" cy="45" r="1"/>
    <circle cx="67" cy="52" r="0.8"/>
    <circle cx="89" cy="38" r="1.2"/>
    <circle cx="234" cy="67" r="0.9"/>
    <circle cx="256" cy="45" r="1"/>
    <circle cx="78" cy="156" r="1.1"/>
    <circle cx="212" cy="148" r="0.8"/>
  </g>
  <!-- Revealed fingerprint (white powder on dark) -->
  <g stroke="#f7fafc" stroke-width="1.5" fill="none">
    <path d="M150 60 Q110 60 110 100 Q110 140 150 140 Q190 140 190 100 Q190 60 150 60"/>
    <path d="M150 70 Q120 70 120 100 Q120 130 150 130 Q180 130 180 100 Q180 70 150 70"/>
    <path d="M150 80 Q130 80 130 100 Q130 120 150 120 Q170 120 170 100 Q170 80 150 80"/>
    <path d="M150 88 Q138 88 138 100 Q138 112 150 112 Q162 112 162 100 Q162 88 150 88"/>
    <path d="M150 95 Q145 95 145 100 Q145 105 150 105 Q155 105 155 100 Q155 95 150 95"/>
  </g>
  <!-- Brush illustration -->
  <g transform="translate(220,30)">
    <rect x="0" y="0" width="8" height="40" fill="#8b5a2b"/>
    <path d="M0 40 Q4 50 8 40" fill="#4a5568"/>
    <ellipse cx="4" cy="55" rx="12" ry="15" fill="#718096" opacity="0.8"/>
  </g>
  <!-- Label -->
  <text x="150" y="190" text-anchor="middle" font-family="Arial" font-size="11" fill="#a0aec0">Powder Dusting Technique</text>
</svg>