<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <rect width="400" height="200" fill="#1a202c"/>
  <!-- Left panel - Latent print -->
  <rect x="10" y="20" width="180" height="150" fill="#2d3748" stroke="#4a5568" stroke-width="2"/>
  <text x="100" y="15" text-anchor="middle" font-family="Arial" font-size="10" fill="#a0aec0">LATENT PRINT</text>
  <!-- Left fingerprint -->
  <g transform="translate(100,95)" stroke="#68d391" stroke-width="1.5" fill="none">
    <ellipse cx="0" cy="0" rx="35" ry="45"/>
    <ellipse cx="0" cy="0" rx="30" ry="38"/>
    <ellipse cx="0" cy="0" rx="25" ry="32"/>
    <ellipse cx="0" cy="0" rx="20" ry="26"/>
    <ellipse cx="0" cy="0" rx="15" ry="20"/>
    <ellipse cx="0" cy="0" rx="10" ry="14"/>
    <!-- Minutiae markers -->
    <circle cx="-20" cy="-25" r="4" stroke="#f6e05e" fill="none" stroke-width="2"/>
    <circle cx="15" cy="10" r="4" stroke="#f6e05e" fill="none" stroke-width="2"/>
    <circle cx="-10" cy="30" r="4" stroke="#f6e05e" fill="none" stroke-width="2"/>
  </g>
  <!-- Divider -->
  <line x1="200" y1="20" x2="200" y2="170" stroke="#4a5568" stroke-width="2" stroke-dasharray="5,5"/>
  <!-- Right panel - Known print -->
  <rect x="210" y="20" width="180" height="150" fill="#2d3748" stroke="#4a5568" stroke-width="2"/>
  <text x="300" y="15" text-anchor="middle" font-family="Arial" font-size="10" fill="#a0aec0">KNOWN PRINT</text>
  <!-- Right fingerprint -->
  <g transform="translate(300,95)" stroke="#68d391" stroke-width="1.5" fill="none">
    <ellipse cx="0" cy="0" rx="35" ry="45"/>
    <ellipse cx="0" cy="0" rx="30" ry="38"/>
    <ellipse cx="0" cy="0" rx="25" ry="32"/>
    <ellipse cx="0" cy="0" rx="20" ry="26"/>
    <ellipse cx="0" cy="0" rx="15" ry="20"/>
    <ellipse cx="0" cy="0" rx="10" ry="14"/>
    <!-- Matching minutiae markers -->
    <circle cx="-20" cy="-25" r="4" stroke="#f6e05e" fill="none" stroke-width="2"/>
    <circle cx="15" cy="10" r="4" stroke="#f6e05e" fill="none" stroke-width="2"/>
    <circle cx="-10" cy="30" r="4" stroke="#f6e05e" fill="none" stroke-width="2"/>
  </g>
  <!-- Match indicator -->
  <rect x="160" y="175" width="80" height="20" rx="3" fill="#48bb78"/>
  <text x="200" y="189" text-anchor="middle" font-family="Arial" font-size="10" fill="#fff" font-weight="bold">MATCH</text>
</svg>