<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none">
  <defs>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f7fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Glass surface -->
  <rect x="10" y="10" width="280" height="180" rx="5" fill="url(#glass)" stroke="#cbd5e0" stroke-width="2"/>
  <!-- Latent fingerprint (faint) -->
  <g opacity="0.4" stroke="#a0aec0" stroke-width="1" fill="none">
    <ellipse cx="150" cy="100" rx="40" ry="50"/>
    <ellipse cx="150" cy="100" rx="35" ry="45"/>
    <ellipse cx="150" cy="100" rx="30" ry="40"/>
    <ellipse cx="150" cy="100" rx="25" ry="35"/>
    <ellipse cx="150" cy="100" rx="20" ry="30"/>
    <ellipse cx="150" cy="100" rx="15" ry="25"/>
    <ellipse cx="150" cy="100" rx="10" ry="18"/>
    <ellipse cx="150" cy="100" rx="5" ry="10"/>
  </g>
  <!-- Label -->
  <text x="150" y="190" text-anchor="middle" font-family="Arial" font-size="11" fill="#718096">Latent Print on Glass Surface</text>
</svg>