<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Lab background -->
  <rect width="400" height="300" fill="#f7fafc"/>
  <!-- Counter/desk -->
  <rect x="0" y="180" width="400" height="120" fill="#e2e8f0"/>
  <rect x="0" y="175" width="400" height="10" fill="#cbd5e0"/>
  <!-- Computer monitor -->
  <rect x="250" y="60" width="130" height="100" rx="5" fill="#2d3748" stroke="#1a202c" stroke-width="3"/>
  <rect x="260" y="70" width="110" height="80" fill="#1a202c"/>
  <!-- Monitor content - fingerprint analysis -->
  <g transform="translate(315,110)" stroke="#68d391" stroke-width="1" fill="none" opacity="0.8">
    <ellipse cx="0" cy="0" rx="25" ry="30"/>
    <ellipse cx="0" cy="0" rx="20" ry="24"/>
    <ellipse cx="0" cy="0" rx="15" ry="18"/>
    <ellipse cx="0" cy="0" rx="10" ry="12"/>
  </g>
  <!-- Monitor stand -->
  <rect x="300" y="160" width="40" height="20" fill="#4a5568"/>
  <!-- Microscope -->
  <g transform="translate(60,100)">
    <rect x="20" y="80" width="60" height="10" fill="#4a5568"/>
    <rect x="40" y="30" width="20" height="55" fill="#2d3748"/>
    <rect x="35" y="20" width="30" height="15" fill="#1a202c"/>
    <circle cx="50" cy="27" r="10" fill="#4a5568" stroke="#2d3748" stroke-width="2"/>
    <rect x="30" y="70" width="40" height="15" fill="#4a5568"/>
  </g>
  <!-- Evidence slide -->
  <rect x="140" y="200" width="80" height="40" rx="3" fill="#fff" stroke="#cbd5e0" stroke-width="1"/>
  <ellipse cx="180" cy="220" rx="20" ry="10" fill="none" stroke="#a0aec0" stroke-width="1" opacity="0.5"/>
  <!-- Case files -->
  <g transform="translate(20,190)">
    <rect x="0" y="0" width="60" height="80" fill="#fbd38d"/>
    <rect x="5" y="5" width="50" height="3" fill="#c05621"/>
    <rect x="5" y="12" width="40" height="2" fill="#718096"/>
    <rect x="5" y="18" width="45" height="2" fill="#718096"/>
    <rect x="5" y="24" width="35" height="2" fill="#718096"/>
  </g>
  <!-- Magnifying glass -->
  <g transform="translate(330,210)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#4a5568" stroke-width="4"/>
    <line x1="14" y1="14" x2="35" y2="35" stroke="#8b5a2b" stroke-width="6"/>
  </g>
</svg>