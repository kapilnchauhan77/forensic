<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Wall background -->
  <rect width="400" height="300" fill="#4a5568"/>
  <!-- Vault door frame -->
  <rect x="50" y="20" width="300" height="260" rx="10" fill="#2d3748" stroke="#1a202c" stroke-width="5"/>
  <!-- Vault door -->
  <rect x="70" y="40" width="260" height="220" rx="5" fill="#718096" stroke="#4a5568" stroke-width="3"/>
  <!-- Door handle/wheel -->
  <circle cx="200" cy="150" r="50" fill="#4a5568" stroke="#2d3748" stroke-width="4"/>
  <circle cx="200" cy="150" r="40" fill="#2d3748"/>
  <!-- Wheel spokes -->
  <g stroke="#4a5568" stroke-width="6">
    <line x1="200" y1="115" x2="200" y2="185"/>
    <line x1="165" y1="150" x2="235" y2="150"/>
    <line x1="175" y1="125" x2="225" y2="175"/>
    <line x1="175" y1="175" x2="225" y2="125"/>
  </g>
  <!-- Locking bolts -->
  <g fill="#1a202c">
    <rect x="60" y="80" width="20" height="30" rx="2"/>
    <rect x="60" y="140" width="20" height="30" rx="2"/>
    <rect x="60" y="200" width="20" height="30" rx="2"/>
    <rect x="320" y="80" width="20" height="30" rx="2"/>
    <rect x="320" y="140" width="20" height="30" rx="2"/>
    <rect x="320" y="200" width="20" height="30" rx="2"/>
  </g>
  <!-- Keypad -->
  <rect x="280" y="100" width="40" height="60" fill="#1a202c" rx="3"/>
  <g fill="#68d391" font-family="monospace" font-size="8">
    <rect x="285" y="105" width="30" height="12" fill="#2d3748"/>
    <text x="290" y="114" fill="#68d391">****</text>
    <circle cx="292" cy="125" r="3"/>
    <circle cx="300" cy="125" r="3"/>
    <circle cx="308" cy="125" r="3"/>
    <circle cx="292" cy="135" r="3"/>
    <circle cx="300" cy="135" r="3"/>
    <circle cx="308" cy="135" r="3"/>
    <circle cx="292" cy="145" r="3"/>
    <circle cx="300" cy="145" r="3"/>
    <circle cx="308" cy="145" r="3"/>
  </g>
  <!-- Fingerprint location indicator -->
  <circle cx="270" cy="180" r="15" fill="none" stroke="#f6e05e" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="270" y="205" text-anchor="middle" font-family="Arial" font-size="8" fill="#f6e05e">PRINT</text>
</svg>