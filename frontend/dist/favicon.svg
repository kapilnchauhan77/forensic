<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fpGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5eead4"/>
      <stop offset="100%" style="stop-color:#14b8a6"/>
    </linearGradient>
  </defs>
  <!-- Dark navy background -->
  <rect width="512" height="512" rx="96" fill="#0f172a"/>

  <!-- Fingerprint ridge pattern -->
  <g fill="none" stroke="url(#fpGrad)" stroke-width="10" stroke-linecap="round">
    <!-- Top outer ridges -->
    <path d="M 160 200 Q 160 120 256 120 Q 352 120 352 200"/>
    <path d="M 140 220 Q 140 100 256 100 Q 372 100 372 220"/>
    <path d="M 120 240 Q 120 80 256 80 Q 392 80 392 240"/>

    <!-- Upper middle ridges -->
    <path d="M 175 230 Q 175 160 256 160 Q 337 160 337 230"/>
    <path d="M 190 250 Q 190 190 256 190 Q 322 190 322 250"/>

    <!-- Center whorl area -->
    <path d="M 200 280 Q 200 230 256 230 Q 312 230 312 280 Q 312 330 256 330 Q 200 330 200 280"/>
    <path d="M 220 290 Q 220 260 256 260 Q 292 260 292 290 Q 292 320 256 320 Q 220 320 220 290"/>

    <!-- Lower ridges -->
    <path d="M 145 280 Q 145 380 256 400 Q 367 380 367 280"/>
    <path d="M 165 290 Q 165 360 256 375 Q 347 360 347 290"/>
    <path d="M 185 300 Q 185 345 256 355 Q 327 345 327 300"/>

    <!-- Bottom ridges -->
    <path d="M 125 260 Q 125 400 256 420 Q 387 400 387 260"/>
  </g>

  <!-- Minutiae points (white circles with dark centers) -->
  <g>
    <!-- Top left minutiae -->
    <circle cx="180" cy="150" r="14" fill="#0f172a" stroke="#ffffff" stroke-width="4"/>
    <!-- Top right minutiae -->
    <circle cx="320" cy="165" r="14" fill="#0f172a" stroke="#ffffff" stroke-width="4"/>
    <!-- Middle left minutiae -->
    <circle cx="165" cy="260" r="14" fill="#0f172a" stroke="#ffffff" stroke-width="4"/>
    <!-- Middle right minutiae -->
    <circle cx="340" cy="240" r="14" fill="#0f172a" stroke="#ffffff" stroke-width="4"/>
    <!-- Bottom left minutiae -->
    <circle cx="200" cy="350" r="14" fill="#0f172a" stroke="#ffffff" stroke-width="4"/>
    <!-- Bottom center minutiae -->
    <circle cx="280" cy="380" r="14" fill="#0f172a" stroke="#ffffff" stroke-width="4"/>
  </g>
</svg>
