# BLOCK 1: Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name fingerprintpro.online www.fingerprintpro.online;

    location / {
        return 301 https://fingerprintpro.online$request_uri;
    }
}

# BLOCK 2: The Main HTTPS Server
server {
    listen 443 ssl;
    server_name fingerprintpro.online www.fingerprintpro.online;
    
    # SSL Certificates (Mapped from your Host VM)
    ssl_certificate /etc/letsencrypt/live/fingerprintpro.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fingerprintpro.online/privkey.pem;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # API Proxy (Preserving your existing settings)
    location ^~ /api/v1/storage/ {
        alias /var/www/storage/;
        autoindex on;  # Enable this temporarily to see if you can browse the folder
        access_log /var/log/nginx/storage_access.log;
        error_log /var/log/nginx/storage_error.log debug;

        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
    location /api {
        proxy_pass http://backend:8000;  # Note: ensure this matches your docker service name
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    # Frontend Static Files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
